<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Svepet – Kväll</title>
  <link rel="icon" type="image/png" href="images/favicon-32.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="masthead">
      <img class="club-logo" src="images/svepet-1024.png" alt="Svepet" />
      <p class="tagline">Gamla vänner, nya vänner, och ett gemensamt beslut att livet blir bättre med ett glas vin, gott sällskap och lite skvaller.</p>
    </div>

    <div class="topbar">
      <div class="topbar-actions">
        <a class="btn btn-ghost" href="smakprofil.html">Min smakprofil</a>
        <button class="btn btn-ghost" id="logout-btn">Logga ut</button>
      </div>
    </div>

    <a href="kvallar.html" class="back-link">&larr; Alla kvällar</a>

    <div class="card" style="margin-top: 14px;">
      <h2 id="kvall-tema">Laddar...</h2>
      <div class="meta" id="kvall-datum"></div>
      <p id="kvall-beskrivning"></p>
      <div id="kvall-actions"></div>
    </div>

    <div class="card" id="edit-kvall-card" style="display: none; margin-top: 16px;">
      <h3>Redigera kväll</h3>
      <form id="edit-kvall-form">
        <label for="edit-tema">Tema</label>
        <input type="text" id="edit-tema" required />

        <label for="edit-datum">Datum</label>
        <input type="date" id="edit-datum" required />

        <label for="edit-beskrivning">Beskrivning (valfritt)</label>
        <textarea id="edit-beskrivning" placeholder="Regler, budget, plats..."></textarea>

        <div class="error-text" id="edit-kvall-error"></div>

        <div class="action-row" style="margin-top: 14px;">
          <button type="submit" class="btn btn-primary">Spara ändringar</button>
          <button type="button" class="btn btn-ghost" id="cancel-edit-kvall">Avbryt</button>
        </div>
      </form>
    </div>

    <div class="toggle-form-wrap" style="margin-top: 24px;">
      <button class="btn btn-primary" id="toggle-new-vin">+ Lägg till vin</button>

      <div class="card" id="new-vin-card" style="display: none; margin-top: 16px;">
        <h3>Nytt vin</h3>
        <form id="new-vin-form">
          <label for="namn">Namn</label>
          <input type="text" id="namn" required />

          <div class="field-row">
            <div>
              <label for="argang">Årgång</label>
              <input type="number" id="argang" min="1900" max="2100" placeholder="t.ex. 2021" />
            </div>
            <div>
              <label for="druva">Druva</label>
              <input type="text" id="druva" />
            </div>
          </div>

          <label for="kategori">Kategori</label>
          <select id="kategori" required>
            <option value="" disabled selected>Välj kategori</option>
            <option value="mousserande">Mousserande</option>
            <option value="vitt lätt">Vitt lätt</option>
            <option value="vitt fylligt">Vitt fylligt</option>
            <option value="rosé">Rosé</option>
            <option value="rött lätt">Rött lätt</option>
            <option value="rött fylligt">Rött fylligt</option>
            <option value="sött">Sött</option>
            <option value="starkvin">Starkvin</option>
          </select>

          <div class="field-row">
            <div>
              <label for="land">Land</label>
              <input type="text" id="land" />
            </div>
            <div>
              <label for="region">Region</label>
              <input type="text" id="region" />
            </div>
          </div>

          <div class="field-row">
            <div>
              <label for="pris">Pris (kr)</label>
              <input type="number" id="pris" min="0" step="0.01" />
            </div>
            <div>
              <label for="alkohol_procent">Alkohol %</label>
              <input type="number" id="alkohol_procent" min="0" max="100" step="0.1" />
            </div>
          </div>

          <label for="volym_ml">Volym (ml)</label>
          <input type="number" id="volym_ml" min="0" step="1" placeholder="t.ex. 750" />

          <label for="bild_url">Bildlänk (valfritt)</label>
          <input type="url" id="bild_url" placeholder="https://..." />

          <label for="systembolaget_lank">Länk till Systembolaget</label>
          <input type="url" id="systembolaget_lank" placeholder="https://www.systembolaget.se/..." />

          <label for="vin-beskrivning">Beskrivning</label>
          <textarea id="vin-beskrivning" placeholder="Egna anteckningar om vinet"></textarea>

          <div class="error-text" id="new-vin-error"></div>

          <div style="margin-top: 14px;">
            <button type="submit" class="btn btn-primary">Spara vin</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card" id="edit-vin-card" style="display: none; margin-top: 16px;">
      <h3>Redigera vin</h3>
      <form id="edit-vin-form">
        <label for="edit-namn">Namn</label>
        <input type="text" id="edit-namn" required />

        <div class="field-row">
          <div>
            <label for="edit-argang">Årgång</label>
            <input type="number" id="edit-argang" min="1900" max="2100" placeholder="t.ex. 2021" />
          </div>
          <div>
            <label for="edit-druva">Druva</label>
            <input type="text" id="edit-druva" />
          </div>
        </div>

        <label for="edit-kategori">Kategori</label>
        <select id="edit-kategori" required>
          <option value="mousserande">Mousserande</option>
          <option value="vitt lätt">Vitt lätt</option>
          <option value="vitt fylligt">Vitt fylligt</option>
          <option value="rosé">Rosé</option>
          <option value="rött lätt">Rött lätt</option>
          <option value="rött fylligt">Rött fylligt</option>
          <option value="sött">Sött</option>
          <option value="starkvin">Starkvin</option>
        </select>

        <div class="field-row">
          <div>
            <label for="edit-land">Land</label>
            <input type="text" id="edit-land" />
          </div>
          <div>
            <label for="edit-region">Region</label>
            <input type="text" id="edit-region" />
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="edit-pris">Pris (kr)</label>
            <input type="number" id="edit-pris" min="0" step="0.01" />
          </div>
          <div>
            <label for="edit-alkohol_procent">Alkohol %</label>
            <input type="number" id="edit-alkohol_procent" min="0" max="100" step="0.1" />
          </div>
        </div>

        <label for="edit-volym_ml">Volym (ml)</label>
        <input type="number" id="edit-volym_ml" min="0" step="1" placeholder="t.ex. 750" />

        <label for="edit-bild_url">Bildlänk (valfritt)</label>
        <input type="url" id="edit-bild_url" placeholder="https://..." />

        <label for="edit-systembolaget_lank">Länk till Systembolaget</label>
        <input type="url" id="edit-systembolaget_lank" placeholder="https://www.systembolaget.se/..." />

        <label for="edit-vin-beskrivning">Beskrivning</label>
        <textarea id="edit-vin-beskrivning" placeholder="Egna anteckningar om vinet"></textarea>

        <div class="error-text" id="edit-vin-error"></div>

        <div class="action-row" style="margin-top: 14px;">
          <button type="submit" class="btn btn-primary">Spara ändringar</button>
          <button type="button" class="btn btn-ghost" id="cancel-edit-vin">Avbryt</button>
        </div>
      </form>
    </div>

    <div class="section-title">
      <h2>Viner</h2>
    </div>

    <div class="list" id="vin-list">
      <div class="empty-state">Laddar...</div>
    </div>
  </div>

  <script type="module" src="js/kvall.js"></script>
</body>
</html>
