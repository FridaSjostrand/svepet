<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Svepet – Logga in</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="center-page">
    <div style="width: 100%; max-width: 380px;">
      <div class="brand">
        <div class="logo">Svepet</div>
        <div class="tagline">Åtta vänner, ett vin i taget</div>
      </div>

      <div class="card">
        <h2>Logga in</h2>
        <form id="login-form">
          <label for="email">E-post</label>
          <input type="email" id="email" required autocomplete="username" />

          <label for="password">Lösenord</label>
          <input type="password" id="password" required autocomplete="current-password" />

          <div class="error-text" id="login-error"></div>

          <div style="margin-top: 18px;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Logga in</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
