<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Svepet – Topplista</title>
  <link rel="icon" type="image/png" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon-180.png" />
  <meta name="apple-mobile-web-app-title" content="Svepet" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="corner-actions">
      <a class="btn btn-ghost" href="smakprofil.html">Min smakprofil</a>
      <button class="btn btn-ghost" id="logout-btn">Logga ut</button>
    </div>

    <div class="masthead">
      <img class="club-logo" src="images/svepet-utan-platta-1024.png" alt="Svepet" />
      <p class="tagline">Gamla vänner, nya vänner, och ett gemensamt beslut att livet blir bättre med ett glas vin, gott sällskap och lite skvaller.</p>
    </div>

    <a href="kvallar.html" class="back-link">&larr; Alla kvällar</a>

    <div class="section-title" style="margin-top: 14px;">
      <h2>Topplista</h2>
    </div>

    <div class="filter-chip-row" id="vy-toggle">
      <button type="button" class="filter-chip active" id="vy-svepet">Svepets topplista</button>
      <button type="button" class="filter-chip" id="vy-min">Min topplista</button>
    </div>

    <div class="filter-chip-row" id="farg-filter">
      <button type="button" class="filter-chip active" data-farg="alla">Alla</button>
      <button type="button" class="filter-chip" data-farg="mousserande">Mousserande</button>
      <button type="button" class="filter-chip" data-farg="vitt">Vitt</button>
      <button type="button" class="filter-chip" data-farg="rosé">Rosé</button>
      <button type="button" class="filter-chip" data-farg="rött">Rött</button>
    </div>

    <div class="list" id="toplista-list" style="margin-top: 20px;">
      <div class="empty-state">Laddar...</div>
    </div>
  </div>

  <script type="module" src="js/toplista.js"></script>
</body>
</html>
