<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Svepet – Logga in</title>
  <link rel="icon" type="image/png" href="images/favicon-32.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="center-page">
    <div style="width: 100%; max-width: 380px;">
      <div class="masthead">
        <img class="club-logo" src="images/svepet-1024.png" alt="Svepet" />
        <p class="tagline">Gamla vänner, nya vänner, och ett gemensamt beslut att livet blir bättre med ett glas vin, gott sällskap och lite skvaller.</p>
      </div>

      <div class="card">
        <h2>Logga in</h2>
        <form id="login-form">
          <label for="email">E-post</label>
          <input type="email" id="email" required autocomplete="username" />

          <label for="password">Lösenord</label>
          <input type="password" id="password" required autocomplete="current-password" />

          <div class="error-text" id="login-error"></div>

          <div style="margin-top: 18px;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Logga in</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
